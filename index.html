<!DOCTYPE html>
<html lang="en">
<head>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="BACKSTAGE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- ✅ PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4B2E83">

<meta charset="UTF-8">
<title>BACKSTAGE</title>

<style>
/* === YOUR ORIGINAL STYLES (unchanged) === */
body { font-family: Arial, sans-serif; margin:0; background:#faf9fc; color:#222; }

header#recitalTitle { 
  background:#4B2E83; color:white; padding:15px; text-align:center; font-size:28px; font-weight:bold; 
  position: relative;
}

#reloadBtn {
  position:absolute;
  right:15px;
  top:12px;
  padding:8px 14px;
  font-size:14px;
  border:none;
  border-radius:6px;
  background:white;
  color:#4B2E83;
  cursor:pointer;
  display:none;
}

.file-picker { text-align:center; margin:10px 0; }

#fileInput { display: none; }

.custom-file-btn {
  padding: 10px 16px;
  background-color: #4B2E83;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 10px;
}

#fileNameDisplay {
  font-weight: bold;
  margin-left: 12px;
  font-size: 16px;
}

.container { display:flex; height:calc(100vh - 160px); }

.column { flex:1; padding:12px; display:flex; flex-direction:column; position: relative; }

.column#recitalColumn,
.column.now-playing-column {
  background: linear-gradient(to bottom, #e6e0f8, #f3edff);
  border-top:3px solid #4B2E83;
}

.column h2 {
  color: white;
  margin: 0;
  padding: 16px 10px;
  text-align: center;
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 1px;
  position: sticky;
  top: 0;
  background: linear-gradient(to right, #4B2E83, #6a4fcf);
  border-bottom: 4px solid #2e1a5a;
}

.now-playing-column h2 {
  font-size: 30px;
}

.scrollableList { overflow-y:auto; flex:1; padding:10px 0; }

.routine { 
  background: rgba(76,46,131,0.1); 
  margin:8px 0; 
  padding:16px; 
  border-radius:8px; 
  cursor:pointer; 
  font-size:18px; 
  position:relative; 
}

.routine.performed { text-decoration:line-through; color:#999; }

.routine.upNext { 
  background:#4B2E83; 
  color:white;
  animation: glowPulse 1s ease infinite alternate;
}

.routine.current { background:#9c5eff; color:white; font-weight:bold; }

.routine .label { 
  position:absolute; 
  right:12px; 
  top:50%; 
  transform:translateY(-50%); 
  font-weight:bold; 
  color:white; 
}

.now-playing { flex:1; display:flex; flex-direction: column; }

.routine-container-wrapper { 
  flex:1; display:flex; justify-content:center; align-items:center; 
}

.routine-container { text-align:center; }

.now-playing .routine-name { font-size:64px; font-weight:bold; }
.now-playing .routine-class { font-size:36px; color:#4B2E83; }

.controls button {
  width: 100%;
  padding: 25px;
  font-size:24px;
  background:#4B2E83;
  color:white;
  border:none;
}

.routine-container.animate {
  animation: stageEnter 0.6s ease;
}

@keyframes stageEnter {
  0% { opacity:0; transform:scale(0.85) translateY(40px); }
  100% { transform:scale(1); }
}

@keyframes glowPulse {
  0% { box-shadow: 0 0 8px rgba(76,46,131,0.5); }
  100% { box-shadow: 0 0 16px rgba(76,46,131,0.9); }
}
</style>
</head>

<body>

<header id="recitalTitle">
  Recital
  <button id="reloadBtn">LOAD NEW RECITAL</button>
</header>

<div class="file-picker">
  <input type="file" id="fileInput" accept=".csv">
  <button id="fileBtn" class="custom-file-btn">Select Recital File</button>
  <span id="fileNameDisplay"></span>
</div>

<div class="container">

  <div class="column" id="recitalColumn">
    <h2>RECITAL ORDER</h2>
    <div id="recitalOrder" class="scrollableList"></div>
  </div>

  <div class="column now-playing-column">
    <h2>NOW ON STAGE</h2>

    <div class="now-playing">
      <div class="routine-container-wrapper">
        <div class="routine-container">
          <div id="nowName" class="routine-name">---</div>
          <div id="nowClass" class="routine-class"></div>
        </div>
      </div>

      <div class="controls">
        <button id="nextBtn">NEXT ROUTINE</button>
      </div>
    </div>
  </div>

</div>

<script>
// === YOUR ORIGINAL LOGIC (restored) ===
let routines=[];
let mainIndex=-1;
let currentIndex=-1;
let playNextIndex=null;
let lastTap=0;
let nextTap=0;
let nextLocked=false;

const picker = document.querySelector(".file-picker");
const reloadBtn = document.getElementById("reloadBtn");
const fileInput = document.getElementById("fileInput");
const fileBtn = document.getElementById("fileBtn");
const fileNameDisplay = document.getElementById("fileNameDisplay");

fileBtn.onclick = () => fileInput.click();

fileInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = evt => {
    routines = parseCSV(evt.target.result);
    mainIndex=-1; currentIndex=-1; playNextIndex=null;

    picker.style.display = "none";
    reloadBtn.style.display = "block";

    fileNameDisplay.textContent = file.name;
    render();
  };
  reader.readAsText(file);
});

reloadBtn.onclick = () => {
  picker.style.display = "block";
  reloadBtn.style.display = "none";
};

function parseCSV(text){
  const lines=text.trim().split("\n");
  document.getElementById("recitalTitle").childNodes[0].nodeValue = (lines[0]||"Recital")+" ";
  return lines.slice(1).map(line=>{
    const p=line.split(",");
    return { name:p[1], class:p[2], performed:false };
  });
}

function render(){
  const el=document.getElementById("recitalOrder");
  el.innerHTML="";

  const nextIndex=playNextIndex!==null?playNextIndex:currentIndex+1;

  routines.forEach((r,i)=>{
    const d=document.createElement("div");
    d.className="routine";

    if(i===currentIndex) d.classList.add("current");
    if(i===nextIndex) d.classList.add("upNext");

    d.textContent=r.name+(r.class?" ("+r.class+")":"");

    d.onclick=()=>{
      const now=Date.now();
      if(now-lastTap<300){
        playNextIndex = (playNextIndex === i) ? null : i;
        render();
      }
      lastTap=now;
    };

    el.appendChild(d);
  });

  updateNow();
}

function updateNow(){
  const r=routines[currentIndex];
  document.getElementById("nowName").textContent=r?r.name:"---";
  document.getElementById("nowClass").textContent=r?r.class:"";
}

document.getElementById("nextBtn").addEventListener("click", function(){
  const now=Date.now();
  if(nextLocked) return;

  if(now-nextTap<400){
    nextRoutine();
    nextLocked=true;
    setTimeout(()=> nextLocked=false, 600);
  }
  nextTap=now;
});

function nextRoutine(){
  const nextIndex = playNextIndex!==null ? playNextIndex : currentIndex+1;
  if(nextIndex === -1 || nextIndex >= routines.length) return;

  if(currentIndex>=0) routines[currentIndex].performed=true;

  if(playNextIndex!==null){
    currentIndex=playNextIndex;
    playNextIndex=null;
  } else {
    currentIndex=nextIndex;
  }

  render();
}

// ✅ SERVICE WORKER (PWA)
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}
</script>

</body>
</html>
