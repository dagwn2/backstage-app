<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4B2E83">

<!-- iOS PWA -->
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="BACKSTAGE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>BACKSTAGE</title>

<style>
body { font-family: Arial, sans-serif; margin:0; background:#faf9fc; }

header {
  background:#4B2E83; color:white; padding:15px;
  text-align:center; font-size:28px; font-weight:bold;
  position:relative;
}

#reloadBtn {
  position:absolute; right:15px; top:12px;
  padding:8px 14px; border:none; border-radius:6px;
  background:white; color:#4B2E83; display:none;
}

.file-picker { text-align:center; margin:10px; }

#fileInput { display:none; }

.custom-file-btn {
  padding:12px 18px;
  background:#4B2E83;
  color:white;
  border:none;
  border-radius:8px;
  font-size:18px;
}

.container { display:flex; height:calc(100vh - 140px); }

.column { flex:1; display:flex; flex-direction:column; }

.column h2 {
  background:#4B2E83; color:white;
  padding:15px; margin:0; text-align:center;
}

.scrollableList { flex:1; overflow-y:auto; padding:10px; }

.routine {
  background:#eee;
  margin:8px 0;
  padding:14px;
  border-radius:8px;
  font-size:18px;
}

.routine.current { background:#9c5eff; color:white; }
.routine.upNext { background:#4B2E83; color:white; }

.now-playing {
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.routine-name { font-size:48px; font-weight:bold; }
.routine-class { font-size:24px; color:#4B2E83; }

.controls button {
  width:100%;
  padding:20px;
  font-size:22px;
  background:#4B2E83;
  color:white;
  border:none;
}
</style>
</head>

<body>

<header id="recitalTitle">
  Recital
  <button id="reloadBtn">LOAD NEW RECITAL</button>
</header>

<div class="file-picker">
  <input type="file" id="fileInput" accept=".csv">
  <button id="fileBtn" class="custom-file-btn">Select Recital File</button>
  <div id="fileNameDisplay"></div>
</div>

<div class="container">

  <div class="column">
    <h2>RECITAL ORDER</h2>
    <div id="recitalOrder" class="scrollableList"></div>
  </div>

  <div class="column">
    <h2>NOW ON STAGE</h2>

    <div class="now-playing">
      <div id="nowName" class="routine-name">---</div>
      <div id="nowClass" class="routine-class"></div>
    </div>

    <div class="controls">
      <button id="nextBtn">NEXT ROUTINE</button>
    </div>
  </div>

</div>

<script>
let routines=[];
let currentIndex=-1;
let playNextIndex=null;
let lastTapTime=0;
let lastTappedIndex=null;

const fileInput = document.getElementById("fileInput");
const fileBtn = document.getElementById("fileBtn");
const fileNameDisplay = document.getElementById("fileNameDisplay");
const reloadBtn = document.getElementById("reloadBtn");

// OPEN FILE PICKER
fileBtn.onclick = () => fileInput.click();

// LOAD FILE
fileInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = evt => {
    const text = evt.target.result;

    localStorage.setItem("csv", text);
    localStorage.setItem("fileName", file.name);

    loadCSV(text);
    fileNameDisplay.textContent = file.name;
    reloadBtn.style.display = "block";
  };

  reader.readAsText(file);
});

// RELOAD BUTTON
reloadBtn.onclick = () => {
  localStorage.removeItem("csv");
  localStorage.removeItem("fileName");
  location.reload();
};

// LOAD CSV
function loadCSV(text){
  const lines = text.trim().split("\n");

  document.getElementById("recitalTitle").childNodes[0].nodeValue =
    (lines[0] || "Recital") + " ";

  routines = lines.slice(1).map(line => {
    const p = line.split(",");
    return {
      name: p[1],
      class: p[2]
    };
  });

  render();
}

// AUTO LOAD SAVED
window.onload = () => {
  const saved = localStorage.getItem("csv");
  const name = localStorage.getItem("fileName");

  if (saved) {
    loadCSV(saved);
    fileNameDisplay.textContent = name || "Loaded file";
    reloadBtn.style.display = "block";
  }
};

// RENDER
function render(){
  const list = document.getElementById("recitalOrder");
  list.innerHTML = "";

  const nextIndex = playNextIndex !== null
    ? playNextIndex
    : currentIndex + 1;

  routines.forEach((r,i)=>{
    const d = document.createElement("div");
    d.className = "routine";

    if(i === currentIndex) d.classList.add("current");
    if(i === nextIndex) d.classList.add("upNext");

    d.textContent = r.name + (r.class ? " ("+r.class+")" : "");

    // DOUBLE TAP
    d.onclick = () => {
      const now = Date.now();

      if (
        lastTappedIndex === i &&
        now - lastTapTime < 300
      ) {
        playNextIndex = (playNextIndex === i) ? null : i;
        render();
      }

      lastTapTime = now;
      lastTappedIndex = i;
    };

    list.appendChild(d);
  });

  updateNow();
}

// UPDATE NOW PLAYING
function updateNow(){
  const r = routines[currentIndex];

  document.getElementById("nowName").textContent = r ? r.name : "---";
  document.getElementById("nowClass").textContent = r ? r.class : "";
}

// NEXT BUTTON
document.getElementById("nextBtn").onclick = () => {

  let nextIndex;

  if(playNextIndex !== null){
    nextIndex = playNextIndex;
    playNextIndex = null;
  } else {
    nextIndex = currentIndex + 1;
  }

  if(nextIndex < routines.length){
    currentIndex = nextIndex;
    render();
  }
};

// SERVICE WORKER
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}
</script>

</body>
</html>
